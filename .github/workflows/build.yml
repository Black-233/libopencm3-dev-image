name: Build OCI Image

on: push

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        uses: redhat-actions/buildah-build@v3
        with:
          image: libopencm3-dev-image
          tags: latest
          containerfiles: ./Containerfile

      - name: Export image
        run: |
          buildah push my-image:latest \
            oci-archive:my-image.tar:latest

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: libopencm3-dev-image
          path: libopencm3-dev-image.tar
          retention-days: 7
